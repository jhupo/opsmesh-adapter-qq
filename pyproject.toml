[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-adapter-qq"
version = "0.1.0"
description = "Native asynchronous QQ Official Bot v1/v2 adapter for OpsMesh"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
httpx = ["opsmesh[httpx,websockets]>=0.6.0,<1.0.0"]
aiohttp = ["opsmesh[aiohttp]>=0.6.0,<1.0.0"]
webhook = [
    "cryptography>=43.0.0",
    "opsmesh[fastapi,httpx]>=0.6.0,<1.0.0",
]
dev = [
    "bandit>=1.7.0",
    "build>=1.2.0",
    "cryptography>=43.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/jhupo/opsmesh-adapter-qq"
Repository = "https://github.com/jhupo/opsmesh-adapter-qq"
Issues = "https://github.com/jhupo/opsmesh-adapter-qq/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qq*"]

[tool.setuptools.package-data]
qq = ["py.typed"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
